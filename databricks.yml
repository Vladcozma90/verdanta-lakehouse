bundle:
  name: verdanta-lakehouse

resources:
  jobs:
    land_to_landing:
      name: verdanta_land_to_landing_${bundle.target}
      tasks:
        - task_key: land
          spark_python_task:
            python_file: jobs/land/run_land.py
            parameters:
              - "--env"
              - "{{job.parameters.env}}"
              - "--ingest_date"
              - "{{job.parameters.ingest_date}}"
              - "--repo_root"
              - "${workspace.file_path}"
          environment_key: default_env
      environments:
        - environment_key: default_env
          spec:
            client: "2"
            dependencies:
              - python-dotenv
              - pydantic-settings
              - pyyaml
      parameters:
        - name: env
          default: dev
        - name: ingest_date
          default: ""

    bootstrap_tables:
      name: verdanta_bootstrap_tables_${bundle.target}
      tasks:
        - task_key: bootstrap
