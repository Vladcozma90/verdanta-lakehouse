snapshots:
  - name: snap_crm_customers
    relation: ref('stg_crm__customers')
    config:
      schema: silver
      database: "{{ target.catalog }}"
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: new_record
      dbt_valid_to_current: "to_date('9999-12-31')"