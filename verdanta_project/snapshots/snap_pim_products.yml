snapshots:
  - name: snap_pim_products
    relation: ref('stg_pim__products')
    config:
      schema: silver
      database: "{{ target.catalog }}"
      unique_key: product_id
      strategy: timestamp
      updated_at: updated_at
      hard_deletes: new_record
      dbt_valid_to_current: "to_date('9999-12-31')"