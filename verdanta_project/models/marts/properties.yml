version: 2

models:
  - name: dim_employee
    columns:
      - name: employee_sk
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests: [not_null]
      - name: employment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'TERMINATED', 'UNKNOWN']

  - name: dim_store
    columns:
      - name: store_sk
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [not_null]
      - name: store_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'CLOSED', 'UNKNOWN']

  - name: dim_supplier
    columns:
      - name: supplier_sk
        data_tests: [unique, not_null]
      - name: supplier_id
        data_tests: [not_null]
      - name: supplier_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE', 'UNKNOWN']

  - name: dim_customer
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'UNKNOWN']
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_product
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: vat_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['STANDARD', 'REDUCED']
      - name: product_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'DISCONTINUED', 'UNKNOWN']
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_country
    columns:
      - name: country_sk
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [unique, not_null]
  
  - name: dim_date
    columns:
      - name: date_sk
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_order_item
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: customer_sk
        data_tests: [not_null]
      - name: product_sk
        data_tests: [not_null]
      - name: store_sk
        data_tests: [not_null]
      - name: employee_sk
        data_tests: [not_null]
        
  - name: fct_return
    columns:
      - name: return_id
        data_tests: [unique, not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: customer_sk
        data_tests: [not_null]
      - name: product_sk
        data_tests: [not_null]
      - name: store_sk
        data_tests: [not_null]