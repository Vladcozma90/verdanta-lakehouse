version: 2

models:
  - name: dim_employee
    description: >
      One row per employee, full rebuild on every run — the source is a full
      snapshot and attribute changes are corrections, not events worth
      versioning. Includes an unknown member row (employee_id = '-1',
      employment_status = 'UNKNOWN') that facts resolve to when there's no
      real employee context, such as online orders.
    columns:
      - name: employee_sk
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests: [not_null]
      - name: employment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'TERMINATED', 'UNKNOWN']

  - name: dim_store
    description: >
      One row per store, full rebuild on every run. Includes an unknown
      member row (store_id = '-1') for orders with no store context —
      online and marketplace channels.
    columns:
      - name: store_sk
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [not_null]
      - name: store_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'CLOSED', 'UNKNOWN']

  - name: dim_supplier
    description: >
      One row per supplier, full rebuild on every run. Includes an unknown
      member row (supplier_id = '-1') for products with no linked supplier.
    columns:
      - name: supplier_sk
        data_tests: [unique, not_null]
      - name: supplier_id
        data_tests: [not_null]
      - name: supplier_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE', 'UNKNOWN']

  - name: dim_customer
    description: >
      Type 2 slowly changing dimension, built from the snap_crm_customers
      snapshot — one row per version of a customer, tracking loyalty tier,
      city, and country over time. customer_sk is hashed on
      (customer_id, valid_from), so it's unique per version, not per
      customer; facts join on valid_from/valid_to to resolve the version
      that was current at the transaction's timestamp, not the customer's
      current tier. Includes an unknown member row (customer_id = '-1')
      for the ~40 orders whose customer_id has no match in the source — a
      known planted defect, see DATA_DICTIONARY.md.
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'UNKNOWN']
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_product
    description: >
      Type 2 slowly changing dimension, built from the snap_pim_products
      snapshot — one row per version of a product, tracking price,
      category, and status over time. Same effective-dated join pattern as
      dim_customer: facts resolve to the version valid at the transaction
      date via valid_from/valid_to, not the product's current state.
      Includes an unknown member row (product_id = '-1').
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: vat_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['STANDARD', 'REDUCED']
      - name: product_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'DISCONTINUED', 'UNKNOWN']
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_country
    description: >
      Conformed dimension built from seed_countries, referenced by both
      dim_customer and dim_store rather than duplicating country name/region
      as flat columns in each. Includes an unknown member row
      (country_code = 'XX').
    columns:
      - name: country_sk
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [unique, not_null]

  - name: dim_date
    description: >
      Static calendar dimension, one row per day, generated in dbt rather
      than sourced from any system. Covers the full history window plus
      buffer for future incremental runs.
    columns:
      - name: date_sk
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_order_item
    description: >
      Transaction fact — one row per line item on a customer order.
      Incremental, merged on order_item_id. customer_sk and product_sk are
      resolved via an effective-dated join against the SCD2 dims (the
      version current at order_ts); store_sk and employee_sk fall back to
      each dimension's unknown member for online/marketplace orders. Every
      FK is guaranteed non-null by construction, so not_null is the correct
      test here — no relationships test is needed.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: customer_sk
        data_tests: [not_null]
      - name: product_sk
        data_tests: [not_null]
      - name: store_sk
        data_tests: [not_null]
      - name: employee_sk
        data_tests: [not_null]

  - name: fct_return
    description: >
      Transaction fact — one row per returned line item on a customer
      order. Incremental, merged on return_id. Dimension keys are resolved
      as of the return date, not the original purchase date — a return is
      treated as its own financial event.
    columns:
      - name: return_id
        data_tests: [unique, not_null]
      - name: date_sk
        data_tests: [not_null]
      - name: customer_sk
        data_tests: [not_null]
      - name: product_sk
        data_tests: [not_null]
      - name: store_sk
        data_tests: [not_null]