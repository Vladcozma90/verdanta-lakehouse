sources:
  - name: bronze
    database: "{{ target.catalog }}"
    schema: bronze
    config:
      loaded_at_field: _ingest_ts
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: crm_customers
      - name: erp_order_items
      - name: erp_orders
      - name: erp_returns
        config:
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
      - name: reference_stores
      - name: pim_products
      - name: pim_suppliers
      - name: hr_employees
        config:
          freshness: null