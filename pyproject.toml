[project]
name = "verdanta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pydantic-settings>=2.0",
    "pydantic>=2.13.4",
    "pyyaml",
    "pyarrow",
    "python-dotenv>=1.2.2",
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-databricks>=7.11.0",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.0",
    "delta-spark==3.2.0",
    "pytest",
    "chispa",
    "ruff",
]
azure = [
    "azure-identity",
    "azure-storage-file-datalake",
]
dbt = [
    "dbt-core==1.12.0",
    "dbt-databricks==1.10.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
